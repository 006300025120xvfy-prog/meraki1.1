<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DRAW RUN</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    #game-container {
      position: absolute;
      width: 400px;
      height: 700px;
      transform-origin: center center;
      overflow: hidden;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      pointer-events: none;
      z-index: 100;
      clip-path: circle(0% at 50% 50%);
      transition: clip-path 0.6s ease-in-out;
    }

    #fade-overlay.fade-in {
      clip-path: circle(150% at 50% 50%);
    }

    #fade-overlay.circle-expand {
      clip-path: circle(150% at 50% 50%);
      transition: clip-path 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #gravity-warning {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 15px;
      font-weight: bold;
      color: #ff0080;
      text-align: center;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      transition: opacity 0.1s;
    }

    #gravity-warning.hidden {
      opacity: 0;
    }

    #countdown-display {
      display: none;
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 75px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 0, 128, 0.9);
      z-index: 20;
      pointer-events: none;
    }

    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('start-bg.png');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #000;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .menu-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      background: none; 
      border: none;       
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s, filter 0.2s;
      text-decoration: none; 
      display: block;
    }

    .menu-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .menu-btn:hover {
      transform: translate(-50%, -50%) scale(1.05);
      filter: brightness(1.15);
    }

    .menu-btn:active {
      transform: translate(-50%, -50%) scale(0.95);
    }

    /* ボタン配置 */
    #start-button { top: 72%; left: 50%; width: 240px; height: 55px; }
    #ranking-button { top: 84%; left: 30%; width: 90px; height: 90px; }
    #custom-button { top: 84%; left: 50%; width: 90px; height: 90px; }
    #howto-button { top: 84%; left: 70%; width: 90px; height: 90px; }

    /* ===== モード選択画面 ===== */
    #mode-select-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: opacity 0.3s ease;
    }

    #mode-select-screen.visible {
      display: flex;
    }

    #mode-select-title {
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 0 0 15px rgba(255, 0, 128, 0.8);
      letter-spacing: 2px;
    }

    .mode-btn {
      width: 280px;
      height: 52px;
      border: 2px solid #ff0080;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
      letter-spacing: 1px;
    }

    .mode-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #2a1a3e 0%, #1a2a4e 100%);
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
    }

    .mode-btn:active {
      transform: scale(0.97);
    }

    .mode-btn.score-attack {
      border-color: #00e5ff;
      background: linear-gradient(135deg, #0a2a2e 0%, #0a3a4e 100%);
    }

    .mode-btn.score-attack:hover {
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
    }

    #mode-back-btn {
      margin-top: 18px;
      width: 140px;
      height: 40px;
      border: 1px solid #666;
      background: transparent;
      color: #aaa;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    #mode-back-btn:hover {
      color: #fff;
      border-color: #aaa;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="countdown-display"></div>

    <div id="fade-overlay"></div>

    <div id="gravity-warning" class="hidden">
      ⚠️ GRAVITY REVERSE! ⚠️
    </div>

    <div id="start-screen">
      <button id="start-button" class="menu-btn"><img src="btn-start.png" alt="START"></button>
      <a href="ranking.html" id="ranking-button" class="menu-btn"><img src="btn-ranking.png" alt="RANKING"></a>
      <a href="custom.html" id="custom-button" class="menu-btn"><img src="btn-custom.png" alt="CUSTOM"></a>
      <a href="howto.html" id="howto-button" class="menu-btn"><img src="btn-howto.png" alt="HOW TO"></a>
    </div>

    <!-- モード選択画面 -->
    <div id="mode-select-screen">
      <div id="mode-select-title">MODE SELECT</div>
      <button class="mode-btn score-attack" data-mode="score">スコアアタック</button>
      <button class="mode-btn" data-mode="stage1">STAGE 1</button>
      <button class="mode-btn" data-mode="stage2">STAGE 2</button>
      <button class="mode-btn" data-mode="stage3">STAGE 3</button>
      <button class="mode-btn" data-mode="stage4">STAGE 4</button>
      <button id="mode-back-btn">戻る</button>
    </div>
  </div>

  <script>
    function adjustScale() {
      const container = document.getElementById('game-container');
      const canvas = document.getElementById('gameCanvas');
      const designWidth = 400;  
      const designHeight = 700; 
      
      canvas.width = designWidth;
      canvas.height = designHeight;

      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      
      const scaleX = windowWidth / designWidth;
      const scaleY = windowHeight / designHeight;
      let scale = Math.min(scaleX, scaleY);
      
      if (scale >= 1) {
        scale = 1;
      }

      container.style.left = "50%";
      container.style.top = "50%";
      container.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener("load", adjustScale);
    window.addEventListener("resize", adjustScale);

    const menuButtons = document.querySelectorAll(".menu-btn");
    menuButtons.forEach(btn => {
      btn.addEventListener("click", (e) => {
        if (btn.tagName === "A" || btn.href) {
          e.preventDefault();
          const targetUrl = btn.href;

          const fadeOverlay = document.getElementById("fade-overlay");
          if (fadeOverlay) {
            fadeOverlay.classList.add("fade-out");
          }

          setTimeout(() => {
            window.location.href = targetUrl;
          }, 400);
        }
      });
    });
  </script>

  <script src="game.js"></script>
  <!-- デバッグ用（本番ではこの行を消すか、debug.jsを置かなければ無効） -->
  <script src="debug.js"></script>
</body>
</html>
